name: HRA-N Qualification CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  qualify:
    name: Formal Proof, Unit Tests & Qualification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Alire & GNAT Toolchain
        uses: alire-project/setup-alire@v6

      - name: Prove SPARK Core
        run: |
          ./tools/prove

      - name: Build Production Executables
        run: |
          ./tools/build

      - name: Run Unit and Frontend Tests
        run: |
          ./tools/test-suite

      - name: Final Production Build
        run: |
          ./tools/build
