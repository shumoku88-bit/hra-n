name: HRA-N Qualification CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  qualify:
    name: Formal Proof, Unit Tests & Qualification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Alire & GNAT Toolchain
        uses: alire-project/setup-alire@v6

      - name: Prove SPARK Core
        run: |
          ./tools/prove

      - name: Build Production Executables
        run: |
          ./tools/build

      - name: Build Ada Unit Test Runner
        run: |
          source ./tools/alire-env
          ensure_alire_environment "$PWD"
          alr exec -- gprbuild -P tests/hra_n_tests.gpr -p

      - name: Test Quantity
        run: ./tests/bin/test_runner Test_Quantity

      - name: Test Relation Command
        run: ./tests/bin/test_runner Test_Relation_Command

      - name: Test Movement
        run: ./tests/bin/test_runner Test_Movement

      - name: Test Event
        run: ./tests/bin/test_runner Test_Event

      - name: Test Actual Bounded History
        run: ./tests/bin/test_runner Test_Actual_Bounded_History

      - name: Test Actual Byte Spans
        run: ./tests/bin/test_runner Test_Actual_Byte_Spans

      - name: Test Actual Replay Refinement
        run: ./tests/bin/test_runner Test_Actual_Replay_Refinement

      - name: Test Actual Reader Refinement
        run: ./tests/bin/test_runner Test_Actual_Reader_Refinement

      - name: Test Actual Writer Transition
        run: ./tests/bin/test_runner Test_Actual_Writer_Transition

      - name: Test Actual Correction Transition
        run: ./tests/bin/test_runner Test_Actual_Correction_Transition

      - name: Test Actual Reversal Transition
        run: ./tests/bin/test_runner Test_Actual_Reversal_Transition

      - name: Test LOAM Actual Reader
        run: ./tests/bin/test_runner Test_Loam_Actual_Reader

      - name: Test LOAM Actual Writer
        run: ./tests/bin/test_runner Test_Loam_Actual_Writer

      - name: Test LOAM Actual Correction Writer
        run: ./tests/bin/test_runner Test_Loam_Actual_Correction_Writer

      - name: Test LOAM Actual Reversal Writer
        run: ./tests/bin/test_runner Test_Loam_Actual_Reversal_Writer

      - name: Test LOAM Actual Reversal Refinement
        run: ./tests/bin/test_runner Test_Loam_Actual_Reversal_Refinement

      - name: Test LOAM Actual Correction Refinement
        run: ./tests/bin/test_runner Test_Loam_Actual_Correction_Refinement

      - name: Test LOAM Actual Writer Refinement
        run: ./tests/bin/test_runner Test_Loam_Actual_Writer_Refinement

      - name: Test LOAM Scheduled Lifecycle Reader
        run: ./tests/bin/test_runner Test_Loam_Scheduled_Lifecycle_Reader

      - name: Test LOAM Scheduled Creation Writer
        run: ./tests/bin/test_runner Test_Loam_Scheduled_Creation_Writer

      - name: Test Validity
        run: ./tests/bin/test_runner Test_Validity

      - name: Test Review
        run: ./tests/bin/test_runner Test_Review

      - name: Test Initializer
        run: ./tests/bin/test_runner Test_Initializer

      - name: Test Path Resolver
        run: ./tests/bin/test_runner Test_Path_Resolver

      - name: Test Atomic Writer
        run: ./tests/bin/test_runner Test_Atomic_Writer

      - name: Test HRA Storage
        run: ./tests/bin/test_runner Test_HRA_Storage

      - name: Test Home Query
        run: ./tests/bin/test_runner Test_Home_Query

      - name: Test Actual Query
        run: ./tests/bin/test_runner Test_Actual_Query

      - name: Test Generation Transaction
        run: ./tests/bin/test_runner Test_Generation_Transaction

      - name: Test Movement Command
        run: ./tests/bin/test_runner Test_Movement_Command

      - name: Test Canonical Movement Command
        run: ./tests/bin/test_runner Test_Canonical_Movement_Command

      - name: Test Canonical Correction Command
        run: ./tests/bin/test_runner Test_Canonical_Correction_Command

      - name: Test Transaction Metadata
        run: ./tests/bin/test_runner Test_Transaction_Metadata

      - name: Test Scheduled Facts
        run: ./tests/bin/test_runner Test_Scheduled_Facts

      - name: Test Scheduled Query
        run: ./tests/bin/test_runner Test_Scheduled_Query

      - name: Test Scheduled Command
        run: ./tests/bin/test_runner Test_Scheduled_Command

      - name: Test Balance Query
        run: ./tests/bin/test_runner Test_Balance_Query

      - name: Test Assertion
        run: ./tests/bin/test_runner Test_Assertion

      - name: Test Capacity Command
        run: ./tests/bin/test_runner Test_Capacity_Command

      - name: Test Budget Query
        run: ./tests/bin/test_runner Test_Budget_Query

      - name: Test Attention Command
        run: ./tests/bin/test_runner Test_Attention_Command

      - name: Test Policy
        run: ./tests/bin/test_runner Test_Policy

      - name: Test Statement
        run: ./tests/bin/test_runner Test_Statement

      - name: Test Terminal UTF-8
        run: ./tests/bin/test_runner Test_Terminal_UTF8

      - name: Run CLI E2E
        run: |
          python3 ./tests/test_cli.py

      - name: Isolated transaction-log probes (not power-loss qualification)
        run: python3 -B ./experiments/test_disk_transaction_log.py

      - name: Open-snapshot POSIX probe (not portable snapshot proof)
        run: python3 -B ./experiments/test_open_snapshot.py

      - name: Run Household Observation E2E
        run: |
          python3 ./tests/test_observation.py

      - name: Run LOAM Actual Qualifier E2E
        run: |
          python3 ./tests/test_loam_qualify.py

      - name: Run TUI PTY E2E
        run: |
          python3 ./tests/test_tui_pty.py

      - name: Final Production Build
        run: |
          ./tools/build
